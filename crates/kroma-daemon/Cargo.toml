[package]
name = "kroma-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The Kroma wallpaper engine daemon"

[package.metadata.cargo-machete]
# These crates are included to force required Wayland backend/protocol feature flags,
# even when no symbols are referenced directly from daemon source.
ignored = ["wayland-backend", "wayland-protocols", "wayland-protocols-wlr"]

[[bin]]
name = "kroma-daemon"
path = "src/main.rs"

[dependencies]
kroma-shared = { path = "../kroma-shared" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true
log.workspace = true
env_logger.workspace = true
wgpu.workspace = true
raw-window-handle.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
smithay-client-toolkit.workspace = true
sysinfo.workspace = true
glam.workspace = true
bytemuck.workspace = true
naga.workspace = true
shaderc.workspace = true
image.workspace = true
x11rb.workspace = true
cpal.workspace = true
rustfft.workspace = true
ffmpeg-next.workspace = true
fontdue.workspace = true
font8x8.workspace = true
notify.workspace = true
