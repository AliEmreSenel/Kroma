[workspace]
resolver = "2"
members = [
    "crates/kroma-shared",
    "crates/kroma-daemon",
    "crates/kroma-gui",
    "crates/kroma-graph",
    "crates/kroma-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kroma Contributors"]
license = "MIT"

[workspace.dependencies]
# Shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

# GPU / Rendering
wgpu = "28"
raw-window-handle = "0.6"

# Wayland
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.20"

# Data providers
sysinfo = "0.38"

# Shader translation
regex = "1"
naga = { version = "28", features = ["glsl-in", "wgsl-out", "spv-in"] }
shaderc = "0.10"

# X11 support
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr"] }
libloading = "0.9"

# IPC
tokio = { version = "1", features = ["full"] }

# .shade packaging
zip = { version = "8", features = ["zstd"] }
memmap2 = "0.9"
zstd = "0.13"
lz4_flex = "0.11"
crc32fast = "1.4"

# Math
glam = "0.32"

# Byte handling
bytemuck = { version = "1", features = ["derive"] }

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Base64 encoding for IPC binary data
base64 = "0.22"

# Audio
cpal = "0.17"
rustfft = "6"

# Video decoding (optional, needs system ffmpeg libs)
ffmpeg-next = "8"

# Font rendering
fontdue = "0.9"
font8x8 = "0.3"

# File watching for hot-reload
notify = "6"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# GUI
iced = { version = "0.14", features = ["tokio", "canvas", "image"] }
rfd = "0.17"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
